name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # arm64 only per the AppSeed spec — GitHub's macos-14/15 runners are M-series,
    # macos-13 is Intel and would produce a wrong-arch binary.
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          xcode-select -p
          swift --version
          xcodebuild -version

      - name: Build both bundles
        run: bash Scripts/build.sh

      - name: Verify code signatures
        run: |
          codesign --verify --deep --strict --verbose=2 build/AppSeedEngine.app
          codesign --verify --deep --strict --verbose=2 build/AppSeed.app

      - name: Verify engine embedded in factory
        run: test -x "build/AppSeed.app/Contents/Resources/Engine/AppSeedEngine.app/Contents/MacOS/AppSeedEngine"

      - name: End-to-end smoke test (--make)
        run: |
          mkdir -p /tmp/appseed-ci
          build/AppSeed.app/Contents/MacOS/AppSeed --make https://example.com --name CITest --out /tmp/appseed-ci
          test -x "/tmp/appseed-ci/CITest.app/Contents/MacOS/CITest"
          codesign --verify --deep --strict "/tmp/appseed-ci/CITest.app"
          # Deterministic bundle id — invariant that guards login persistence
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "/tmp/appseed-ci/CITest.app/Contents/Info.plist")
          test "$BUNDLE_ID" = "com.appseed.wrapped.example-com" || (echo "unexpected bundle id: $BUNDLE_ID" && exit 1)

      - name: Verify quarantine attribute stripped
        run: |
          # `xattr -cr` must run in the pipeline; a quarantined + ad-hoc-signed
          # app would fail Gatekeeper with the "damaged, move to Trash" error.
          if xattr -p com.apple.quarantine "/tmp/appseed-ci/CITest.app" 2>/dev/null; then
            echo "Bundle still has quarantine attribute" && exit 1
          fi

      - name: Report bundle sizes
        run: |
          du -sh build/AppSeedEngine.app build/AppSeed.app "/tmp/appseed-ci/CITest.app"
